[package]
name = "termote"
version = "0.1.0"
description = "Termote Host Manager - Tauri Desktop App"
authors = ["Ali Sharjeel"]
license = "MIT"
repository = "https://github.com/AliSharjeell/Termote"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
tokio = { version = "1", features = ["full"] }