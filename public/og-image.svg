<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0C0C0C"/>

  <!-- Gradient accent -->
  <rect width="1200" height="630" fill="url(#gradient)"/>
  <defs>
    <radialGradient id="gradient" cx="50%" cy="-20%" r="80%">
      <stop offset="0%" stop-color="#1a1a2e" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0C0C0C" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="157" x2="1200" y2="157" stroke="#666" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="#666" stroke-width="1"/>
    <line x1="0" y1="473" x2="1200" y2="473" stroke="#666" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="#666" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="#666" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="#666" stroke-width="1"/>
  </g>

  <!-- Terminal window frame -->
  <rect x="100" y="150" width="1000" height="380" rx="12" fill="#161616" stroke="#333" stroke-width="2"/>

  <!-- Terminal header -->
  <rect x="100" y="150" width="1000" height="40" rx="12" fill="#1a1a1a"/>
  <rect x="100" y="180" width="1000" height="10" fill="#1a1a1a"/>

  <!-- Window buttons -->
  <circle cx="130" cy="170" r="6" fill="#E44"/>
  <circle cx="154" cy="170" r="6" fill="#E4A"/>
  <circle cx="178" cy="170" r="6" fill="#4A4"/>

  <!-- Terminal content area - 2x2 grid of panes -->
  <!-- Pane 1 - top left -->
  <rect x="120" y="210" width="475" height="150" rx="6" fill="#0C0C0C" stroke="#333" stroke-width="1"/>
  <text x="135" y="235" fill="#4A4" font-family="monospace" font-size="14" font-weight="bold">alish@DESKTOP</text>
  <text x="135" y="255" fill="#CCC" font-family="monospace" font-size="12">~/Projects/termote</text>
  <text x="135" y="275" fill="#CCC" font-family="monospace" font-size="12">$ cargo build --release</text>
  <text x="135" y="295" fill="#4A4" font-family="monospace" font-size="11">Compiling termote v0.1.0...</text>
  <text x="135" y="315" fill="#4A4" font-family="monospace" font-size="11">Finished release [optimized]</text>

  <!-- Pane 2 - top right -->
  <rect x="605" y="210" width="475" height="150" rx="6" fill="#0C0C0C" stroke="#333" stroke-width="1"/>
  <text x="620" y="235" fill="#4AA" font-family="monospace" font-size="14" font-weight="bold">logs</text>
  <text x="620" y="255" fill="#CCC" font-family="monospace" font-size="11">2026-03-24 10:42:01 INFO</text>
  <text x="620" y="270" fill="#CCC" font-family="monospace" font-size="11">  termote started on</text>
  <text x="620" y="285" fill="#CCC" font-family="monospace" font-size="11">  port 9090</text>
  <text x="620" y="305" fill="#4A4" font-family="monospace" font-size="11">✓ WebSocket ready</text>

  <!-- Pane 3 - bottom left -->
  <rect x="120" y="370" width="475" height="140" rx="6" fill="#0C0C0C" stroke="#333" stroke-width="1"/>
  <text x="135" y="395" fill="#AA4" font-family="monospace" font-size="14" font-weight="bold">server</text>
  <text x="135" y="415" fill="#CCC" font-family="monospace" font-size="11">GET /health 200</text>
  <text x="135" y="430" fill="#CCC" font-family="monospace" font-size="11">GET /api/status 200</text>
  <text x="135" y="450" fill="#4A4" font-family="monospace" font-size="11">✓ All systems operational</text>

  <!-- Pane 4 - bottom right -->
  <rect x="605" y="370" width="475" height="140" rx="6" fill="#0C0C0C" stroke="#333" stroke-width="1"/>
  <text x="620" y="395" fill="#A4A" font-family="monospace" font-size="14" font-weight="bold">shell</text>
  <text x="620" y="415" fill="#CCC" font-family="monospace" font-size="11">PowerShell 7.4.2</text>
  <text x="620" y="430" fill="#CCC" font-family="monospace" font-size="11">Connected via WSS</text>
  <text x="620" y="450" fill="#4A4" font-family="monospace" font-size="11">✓ Encrypted session</text>

  <!-- Branding -->
  <text x="600" y="580" fill="#FFF" font-family="sans-serif" font-size="48" font-weight="bold" text-anchor="middle">Termote</text>
  <text x="600" y="610" fill="#808080" font-family="sans-serif" font-size="18" text-anchor="middle">Your Local CLI, Anywhere</text>
</svg>
